<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TEST - Repas</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <h1>Repas</h1>
      <span id="role-badge" class="role-badge"></span>
      <button type="button" id="quit" class="link-btn">Quitter</button>
    </header>

    <p id="status" class="status" role="alert" title="Cliquer pour masquer" hidden></p>

    <main>
      <section id="tab-home" class="tab"></section>
      <section id="tab-meals" class="tab" hidden></section>
      <section id="tab-admin" class="tab" hidden></section>
    </main>

    <button type="button" id="today-btn" class="today-btn" hidden>Aujourd'hui</button>

    <nav id="tabs" class="tabs" aria-label="Navigation">
      <button type="button" data-tab="home" class="on">Accueil</button>
      <button type="button" data-tab="meals">Repas</button>
      <button type="button" data-tab="admin" id="tab-admin-btn" hidden>Admin</button>
    </nav>
  </div>

  <div id="gate" class="gate">
    <form id="gate-form" class="gate-box">
      <h2>Repas de la famille</h2>
      <input id="user-id" type="text" placeholder="Identifiant" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button type="submit">Entrer</button>
      <p id="gate-error" class="error" role="alert"></p>
    </form>
  </div>

  <dialog id="meal-dialog" class="dialog meal-dialog" aria-labelledby="meal-title">
    <h2 id="meal-title" class="dialog-title"></h2>
    <div class="copy-row">
      <label for="meal-copy">Copier depuis un repas existant</label>
      <select id="meal-copy"></select>
    </div>
    <p class="dialog-hint">Laissez vides les parties que vous ne voulez pas remplir.</p>
    <div id="meal-rows" class="meal-rows"></div>
    <div id="meal-portions" class="meal-portions"></div>
    <p id="meal-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="meal-cancel" class="btn-no">Annuler</button>
      <button type="button" id="meal-save" class="btn-yes">Enregistrer</button>
    </div>
  </dialog>

  <dialog id="day-dialog" class="dialog" aria-labelledby="day-title">
    <h2 id="day-title" class="dialog-title"></h2>
    <p class="dialog-hint">Contraintes à respecter ce jour-là (information seulement). Plusieurs choix possibles.</p>
    <div id="day-checks"></div>
    <p id="day-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="day-cancel" class="btn-no">Annuler</button>
      <button type="button" id="day-save" class="btn-yes">Enregistrer</button>
    </div>
  </dialog>

  <dialog id="constraint-dialog" class="dialog" aria-labelledby="constraint-title">
    <h2 id="constraint-title" class="dialog-title">Modifier la contrainte</h2>
    <input id="constraint-name" class="tag-input" type="text" maxlength="60" autocomplete="off" placeholder="Nom de la contrainte">
    <div id="constraint-effects"></div>
    <p id="constraint-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="constraint-cancel" class="btn-no">Annuler</button>
      <button type="button" id="constraint-save" class="btn-yes">Enregistrer</button>
    </div>
  </dialog>

  <dialog id="ingredient-dialog" class="dialog" aria-labelledby="ingredient-title">
    <h2 id="ingredient-title" class="dialog-title">Modifier l'ingrédient</h2>
    <input id="ingredient-name" class="tag-input" type="text" maxlength="60" autocomplete="off" placeholder="Nom de l'ingrédient">
    <label class="unit-row">Unité <span id="ingredient-unit"></span></label>
    <p id="ingredient-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="ingredient-cancel" class="btn-no">Annuler</button>
      <button type="button" id="ingredient-save" class="btn-yes">Enregistrer</button>
    </div>
  </dialog>

  <dialog id="food-dialog" class="dialog" aria-labelledby="food-dialog-title">
    <h2 id="food-dialog-title" class="dialog-title">Modifier l'aliment</h2>
    <div class="form-grid">
      <label for="food-edit-name">Nom</label>
      <input id="food-edit-name" type="text" maxlength="60" autocomplete="off">
      <span class="form-label">Classes</span>
      <div id="food-edit-classes"></div>
      <span id="food-edit-ing-label" class="form-label">Ingrédients</span>
      <div id="food-edit-ingredients"></div>
    </div>
    <p id="food-edit-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="food-edit-cancel" class="btn-no">Annuler</button>
      <button type="button" id="food-edit-save" class="btn-yes">Enregistrer</button>
    </div>
  </dialog>

  <dialog id="usage-dialog" class="dialog" aria-labelledby="usage-title">
    <h2 id="usage-title" class="dialog-title"></h2>
    <p id="usage-name" class="usage-name"></p>
    <p id="usage-hint" class="dialog-hint"></p>
    <ul id="usage-list" class="usage-list"></ul>
    <div class="dialog-actions">
      <button type="button" id="usage-close" class="btn-yes">Fermer</button>
    </div>
  </dialog>

  <dialog id="confirm" class="dialog confirm" aria-labelledby="confirm-title">
    <p id="confirm-title" class="confirm-title"></p>
    <p id="confirm-detail" class="confirm-detail"></p>
    <div class="dialog-actions">
      <button type="button" id="confirm-no" class="btn-no">Non</button>
      <button type="button" id="confirm-yes" class="btn-yes">Oui</button>
    </div>
  </dialog>

  <script src="mock.js"></script>
  <script src="../app.js"></script>
</body>
</html>
