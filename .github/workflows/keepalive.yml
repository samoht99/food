name: Keep Supabase alive

# Le plan gratuit de Supabase met en pause un projet inactif 7 jours.
# Cet appel quotidien (sans donnée sensible) évite la mise en pause.
# La fonction ping supprime aussi les repas de plus de 30 jours.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "https://bwcizhvhtwkjfjadurcj.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_KLQZ-MuQKYbV1_GUvOFk9Q_nfumGtNc" \
            -H "Content-Profile: food" \
            -H "Content-Type: application/json" \
            -d '{}'
